<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>Forest Gate Detection Visualization</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #1a1a2e; color: #eee; font-family: 'Segoe UI', sans-serif; padding: 20px; }
h1 { text-align: center; margin-bottom: 5px; font-size: 22px; color: #e0e0e0; }
.subtitle { text-align: center; color: #888; margin-bottom: 20px; font-size: 13px; }
.container { display: flex; gap: 20px; justify-content: center; flex-wrap: wrap; }
.panel { background: #16213e; border-radius: 10px; padding: 15px; }
.panel h2 { font-size: 14px; color: #a0c4ff; margin-bottom: 10px; text-align: center; }
canvas { display: block; border-radius: 6px; cursor: crosshair; }
.profile-panel { width: 620px; }
.legend { display: flex; gap: 15px; justify-content: center; margin-top: 10px; flex-wrap: wrap; }
.legend-item { display: flex; align-items: center; gap: 5px; font-size: 12px; }
.legend-color { width: 14px; height: 14px; border-radius: 3px; }
.controls { text-align: center; margin: 15px 0; }
.controls button {
    background: #0f3460; color: #e0e0e0; border: 1px solid #a0c4ff;
    padding: 8px 18px; border-radius: 6px; cursor: pointer; font-size: 13px; margin: 0 5px;
}
.controls button:hover { background: #1a5276; }
.info { text-align: center; color: #888; font-size: 12px; margin-top: 10px; }
.stats { display: flex; gap: 30px; justify-content: center; margin-top: 10px; font-size: 13px; }
.stat-item { text-align: center; }
.stat-val { font-size: 20px; color: #ffd700; font-weight: bold; }
.stat-label { color: #888; font-size: 11px; }
</style>
</head>
<body>

<h1>Gate-Constrained Hybrid A* — Gate 检测可视化</h1>
<p class="subtitle">Gate = 森林中两棵树之间车必须穿过的窄口（clearance 曲线的局部极小值）</p>

<div class="controls">
    <button onclick="regenerate()">重新生成森林</button>
    <button onclick="toggleSkeleton()">显示/隐藏 骨架</button>
    <button onclick="toggleClearance()">显示/隐藏 Clearance 热力图</button>
</div>

<div class="stats" id="stats"></div>

<div class="container">
    <div class="panel">
        <h2>森林地图 + 骨架 + Gate</h2>
        <canvas id="mapCanvas" width="560" height="560"></canvas>
        <div class="legend">
            <div class="legend-item"><div class="legend-color" style="background:#2d5016"></div>树干</div>
            <div class="legend-item"><div class="legend-color" style="background:#4fc3f7"></div>骨架路径</div>
            <div class="legend-item"><div class="legend-color" style="background:#ff5252"></div>Gate (瓶颈)</div>
            <div class="legend-item"><div class="legend-color" style="background:#76ff03"></div>起点</div>
            <div class="legend-item"><div class="legend-color" style="background:#ffab00"></div>终点</div>
        </div>
    </div>

    <div class="panel profile-panel">
        <h2>沿骨架路径的 Clearance 曲线（Gate = 局部极小值）</h2>
        <canvas id="profileCanvas" width="590" height="250"></canvas>
        <div class="info">横轴 = 沿骨架路径距离(m)，纵轴 = 到最近障碍物距离(m)</div>
        <h2 style="margin-top:15px">Gate-Constrained HA* 工作原理</h2>
        <canvas id="conceptCanvas" width="590" height="230"></canvas>
    </div>
</div>

<script>
const MAP_SIZE = 280;
const CELL = 0.1;
const SCALE = 2;
const CANVAS = MAP_SIZE * SCALE;

let trees = [];
let skeleton = [];
let gates = [];
let clearanceProfile = [];
let showSkeleton = true;
let showClearanceMap = false;
let edtData = null;

function rand(a, b) { return Math.random() * (b - a) + a; }
function dist(x1, y1, x2, y2) { return Math.hypot(x2 - x1, y2 - y1); }

function generateForest() {
    trees = [];
    const mapW = MAP_SIZE * CELL;
    const margin = 1.0;
    const startX = mapW * 0.12, startY = mapW * 0.5;
    const goalX = mapW * 0.88, goalY = mapW * 0.5;
    const trunkGap = 0.9 + Math.random() * 0.3;

    for (let attempt = 0; attempt < 8000 && trees.length < 70; attempt++) {
        const r = rand(0.15, 0.35);
        const x = rand(margin, mapW - margin);
        const y = rand(margin, mapW - margin);

        if (dist(x, y, startX, startY) < 1.5 + r) continue;
        if (dist(x, y, goalX, goalY) < 1.5 + r) continue;

        let ok = true;
        for (const t of trees) {
            const minD = t.r + r + trunkGap * (0.7 + Math.random() * 0.6);
            if (dist(x, y, t.x, t.y) < minD) { ok = false; break; }
        }
        if (ok) trees.push({ x, y, r });
    }

    computeEDT();
    computeSkeleton();
    detectGates();
    render();
    renderProfile();
    renderConcept();
    updateStats();
}

function computeEDT() {
    edtData = new Float32Array(MAP_SIZE * MAP_SIZE);
    for (let gy = 0; gy < MAP_SIZE; gy++) {
        for (let gx = 0; gx < MAP_SIZE; gx++) {
            const wx = gx * CELL;
            const wy = gy * CELL;
            let minD = 999;
            for (const t of trees) {
                const d = dist(wx, wy, t.x, t.y) - t.r;
                if (d < minD) minD = d;
            }
            const dBorder = Math.min(wx, wy, MAP_SIZE * CELL - wx, MAP_SIZE * CELL - wy);
            edtData[gy * MAP_SIZE + gx] = Math.max(0, Math.min(minD, dBorder));
        }
    }
}

function computeSkeleton() {
    skeleton = [];
    const mapW = MAP_SIZE * CELL;
    const startX = mapW * 0.12, startY = mapW * 0.5;
    const goalX = mapW * 0.88, goalY = mapW * 0.5;

    const steps = 200;
    let cx = startX, cy = startY;

    for (let i = 0; i <= steps; i++) {
        const t = i / steps;
        const targetX = startX + (goalX - startX) * t;
        const targetY = startY + (goalY - startY) * t;

        let bestX = targetX, bestY = targetY, bestScore = -999;

        for (let dy = -8; dy <= 8; dy += 1) {
            const tryY = targetY + dy * CELL * 3;
            if (tryY < 0.5 || tryY > mapW - 0.5) continue;
            const gx = Math.min(MAP_SIZE - 1, Math.max(0, Math.round(targetX / CELL)));
            const gy = Math.min(MAP_SIZE - 1, Math.max(0, Math.round(tryY / CELL)));
            const cl = edtData[gy * MAP_SIZE + gx];
            const distPenalty = Math.abs(tryY - targetY) * 0.3;
            const contPenalty = skeleton.length > 0 ? Math.abs(tryY - skeleton[skeleton.length - 1].y) * 0.5 : 0;
            const score = cl - distPenalty - contPenalty;
            if (score > bestScore) {
                bestScore = score;
                bestX = targetX;
                bestY = tryY;
            }
        }
        skeleton.push({ x: bestX, y: bestY });
    }
}

function detectGates() {
    gates = [];
    clearanceProfile = [];

    let cumDist = 0;
    for (let i = 0; i < skeleton.length; i++) {
        if (i > 0) cumDist += dist(skeleton[i].x, skeleton[i].y, skeleton[i-1].x, skeleton[i-1].y);
        const gx = Math.min(MAP_SIZE - 1, Math.max(0, Math.round(skeleton[i].x / CELL)));
        const gy = Math.min(MAP_SIZE - 1, Math.max(0, Math.round(skeleton[i].y / CELL)));
        const cl = edtData[gy * MAP_SIZE + gx];
        clearanceProfile.push({ dist: cumDist, clearance: cl, idx: i });
    }

    const windowSize = 15;
    const minProminence = 0.15;
    const minSeparation = 3.0;

    for (let i = windowSize; i < clearanceProfile.length - windowSize; i++) {
        const c = clearanceProfile[i].clearance;
        let isMin = true;
        let maxNeighbor = c;
        for (let j = i - windowSize; j <= i + windowSize; j++) {
            if (j === i) continue;
            if (clearanceProfile[j].clearance < c - 0.001) { isMin = false; break; }
            if (clearanceProfile[j].clearance > maxNeighbor) maxNeighbor = clearanceProfile[j].clearance;
        }
        if (!isMin) continue;
        const prominence = maxNeighbor - c;
        if (prominence < minProminence) continue;

        let tooClose = false;
        for (const g of gates) {
            if (Math.abs(clearanceProfile[i].dist - g.pathDist) < minSeparation) {
                tooClose = true; break;
            }
        }
        if (tooClose) continue;

        gates.push({
            x: skeleton[i].x,
            y: skeleton[i].y,
            clearance: c,
            prominence: prominence,
            pathDist: clearanceProfile[i].dist,
            idx: i
        });
    }

    gates.sort((a, b) => a.clearance - b.clearance);
    gates = gates.slice(0, 4);
    gates.sort((a, b) => a.pathDist - b.pathDist);
}

function render() {
    const canvas = document.getElementById('mapCanvas');
    const ctx = canvas.getContext('2d');
    canvas.width = CANVAS;
    canvas.height = CANVAS;

    ctx.fillStyle = '#1a1a1a';
    ctx.fillRect(0, 0, CANVAS, CANVAS);

    if (showClearanceMap && edtData) {
        for (let gy = 0; gy < MAP_SIZE; gy++) {
            for (let gx = 0; gx < MAP_SIZE; gx++) {
                const cl = edtData[gy * MAP_SIZE + gx];
                const v = Math.min(1, cl / 3.0);
                const r = Math.round(v * 30);
                const g = Math.round(v * 60);
                const b = Math.round(v * 100);
                ctx.fillStyle = `rgb(${r},${g},${b})`;
                ctx.fillRect(gx * SCALE, gy * SCALE, SCALE, SCALE);
            }
        }
    }

    for (const t of trees) {
        const gradient = ctx.createRadialGradient(
            t.x / CELL * SCALE, t.y / CELL * SCALE, 0,
            t.x / CELL * SCALE, t.y / CELL * SCALE, t.r / CELL * SCALE
        );
        gradient.addColorStop(0, '#4a7c2f');
        gradient.addColorStop(0.7, '#2d5016');
        gradient.addColorStop(1, '#1a3a0a');
        ctx.beginPath();
        ctx.arc(t.x / CELL * SCALE, t.y / CELL * SCALE, t.r / CELL * SCALE, 0, Math.PI * 2);
        ctx.fillStyle = gradient;
        ctx.fill();
        ctx.strokeStyle = '#1a3a0a';
        ctx.lineWidth = 0.5;
        ctx.stroke();
    }

    if (showSkeleton && skeleton.length > 1) {
        ctx.beginPath();
        ctx.moveTo(skeleton[0].x / CELL * SCALE, skeleton[0].y / CELL * SCALE);
        for (let i = 1; i < skeleton.length; i++) {
            ctx.lineTo(skeleton[i].x / CELL * SCALE, skeleton[i].y / CELL * SCALE);
        }
        ctx.strokeStyle = '#4fc3f7';
        ctx.lineWidth = 2;
        ctx.setLineDash([6, 3]);
        ctx.stroke();
        ctx.setLineDash([]);
    }

    for (let gi = 0; gi < gates.length; gi++) {
        const g = gates[gi];
        const px = g.x / CELL * SCALE;
        const py = g.y / CELL * SCALE;
        const gr = g.clearance / CELL * SCALE;

        ctx.beginPath();
        ctx.arc(px, py, gr, 0, Math.PI * 2);
        ctx.strokeStyle = 'rgba(255, 82, 82, 0.6)';
        ctx.lineWidth = 2;
        ctx.setLineDash([4, 4]);
        ctx.stroke();
        ctx.setLineDash([]);

        ctx.beginPath();
        ctx.arc(px, py, 6, 0, Math.PI * 2);
        ctx.fillStyle = '#ff5252';
        ctx.fill();
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 1.5;
        ctx.stroke();

        ctx.fillStyle = '#fff';
        ctx.font = 'bold 14px Segoe UI';
        ctx.textAlign = 'center';
        ctx.fillText(`G${gi + 1}`, px, py - 12);

        ctx.font = '10px Segoe UI';
        ctx.fillStyle = '#ffab00';
        ctx.fillText(`${g.clearance.toFixed(2)}m`, px, py + 20);
    }

    const mapW = MAP_SIZE * CELL;
    const sx = mapW * 0.12 / CELL * SCALE;
    const sy = mapW * 0.5 / CELL * SCALE;
    ctx.beginPath();
    ctx.arc(sx, sy, 10, 0, Math.PI * 2);
    ctx.fillStyle = '#76ff03';
    ctx.fill();
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.fillStyle = '#000';
    ctx.font = 'bold 11px Segoe UI';
    ctx.textAlign = 'center';
    ctx.fillText('S', sx, sy + 4);

    const gx = mapW * 0.88 / CELL * SCALE;
    const gy2 = mapW * 0.5 / CELL * SCALE;
    ctx.beginPath();
    ctx.arc(gx, gy2, 10, 0, Math.PI * 2);
    ctx.fillStyle = '#ffab00';
    ctx.fill();
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.fillStyle = '#000';
    ctx.font = 'bold 11px Segoe UI';
    ctx.fillText('G', gx, gy2 + 4);
}

function renderProfile() {
    const canvas = document.getElementById('profileCanvas');
    const ctx = canvas.getContext('2d');
    const W = canvas.width, H = canvas.height;
    ctx.fillStyle = '#0d1b2a';
    ctx.fillRect(0, 0, W, H);

    if (clearanceProfile.length < 2) return;

    const padL = 50, padR = 20, padT = 15, padB = 35;
    const plotW = W - padL - padR;
    const plotH = H - padT - padB;

    const maxDist = clearanceProfile[clearanceProfile.length - 1].dist;
    const maxCl = Math.max(...clearanceProfile.map(p => p.clearance)) * 1.1;

    ctx.strokeStyle = '#334';
    ctx.lineWidth = 0.5;
    for (let v = 0; v <= maxCl; v += 0.5) {
        const y = padT + plotH - (v / maxCl) * plotH;
        ctx.beginPath(); ctx.moveTo(padL, y); ctx.lineTo(padL + plotW, y); ctx.stroke();
        ctx.fillStyle = '#666';
        ctx.font = '10px monospace';
        ctx.textAlign = 'right';
        ctx.fillText(v.toFixed(1), padL - 5, y + 3);
    }
    for (let d = 0; d <= maxDist; d += 5) {
        const x = padL + (d / maxDist) * plotW;
        ctx.beginPath(); ctx.moveTo(x, padT); ctx.lineTo(x, padT + plotH); ctx.stroke();
        ctx.fillStyle = '#666';
        ctx.font = '10px monospace';
        ctx.textAlign = 'center';
        ctx.fillText(d.toFixed(0) + 'm', x, padT + plotH + 15);
    }

    ctx.beginPath();
    for (let i = 0; i < clearanceProfile.length; i++) {
        const x = padL + (clearanceProfile[i].dist / maxDist) * plotW;
        const y = padT + plotH - (clearanceProfile[i].clearance / maxCl) * plotH;
        if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.strokeStyle = '#4fc3f7';
    ctx.lineWidth = 2;
    ctx.stroke();

    const grd = ctx.createLinearGradient(0, padT, 0, padT + plotH);
    grd.addColorStop(0, 'rgba(79,195,247,0.15)');
    grd.addColorStop(1, 'rgba(79,195,247,0)');
    ctx.lineTo(padL + plotW, padT + plotH);
    ctx.lineTo(padL, padT + plotH);
    ctx.closePath();
    ctx.fillStyle = grd;
    ctx.fill();

    for (const g of gates) {
        const x = padL + (g.pathDist / maxDist) * plotW;
        const y = padT + plotH - (g.clearance / maxCl) * plotH;
        ctx.beginPath();
        ctx.moveTo(x, padT);
        ctx.lineTo(x, padT + plotH);
        ctx.strokeStyle = 'rgba(255,82,82,0.5)';
        ctx.lineWidth = 1;
        ctx.setLineDash([3, 3]);
        ctx.stroke();
        ctx.setLineDash([]);

        ctx.beginPath();
        ctx.arc(x, y, 5, 0, Math.PI * 2);
        ctx.fillStyle = '#ff5252';
        ctx.fill();
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 1.5;
        ctx.stroke();

        ctx.fillStyle = '#ff8a80';
        ctx.font = 'bold 11px Segoe UI';
        ctx.textAlign = 'center';
        ctx.fillText(`Gate`, x, padT + 12);
    }

    const vehicleWidth = 0.74;
    const vwY = padT + plotH - (vehicleWidth / 2 / maxCl) * plotH;
    ctx.beginPath();
    ctx.moveTo(padL, vwY);
    ctx.lineTo(padL + plotW, vwY);
    ctx.strokeStyle = 'rgba(255,171,0,0.6)';
    ctx.lineWidth = 1;
    ctx.setLineDash([8, 4]);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = '#ffab00';
    ctx.font = '10px Segoe UI';
    ctx.textAlign = 'left';
    ctx.fillText('车身半宽 0.37m', padL + plotW - 90, vwY - 4);
}

function renderConcept() {
    const canvas = document.getElementById('conceptCanvas');
    const ctx = canvas.getContext('2d');
    const W = canvas.width, H = canvas.height;
    ctx.fillStyle = '#0d1b2a';
    ctx.fillRect(0, 0, W, H);

    const y1 = 60, y2 = 160;
    const startX = 50, endX = 540;

    ctx.fillStyle = '#a0c4ff';
    ctx.font = 'bold 12px Segoe UI';
    ctx.textAlign = 'left';
    ctx.fillText('普通 HA*:  state = (x, y, θ)', 30, 30);
    ctx.fillText('Gate HA*:  state = (x, y, θ, i)', 30, y2 - 30);

    // vanilla HA*
    ctx.beginPath();
    ctx.arc(startX, y1, 8, 0, Math.PI * 2);
    ctx.fillStyle = '#76ff03'; ctx.fill();
    ctx.beginPath();
    ctx.arc(endX, y1, 8, 0, Math.PI * 2);
    ctx.fillStyle = '#ffab00'; ctx.fill();

    // wavy search line
    ctx.beginPath();
    ctx.moveTo(startX + 10, y1);
    for (let x = startX + 10; x < endX - 10; x += 3) {
        const progress = (x - startX) / (endX - startX);
        const wave = Math.sin(progress * 20) * (15 - progress * 10) + Math.sin(progress * 7) * 8;
        ctx.lineTo(x, y1 + wave);
    }
    ctx.lineTo(endX - 10, y1);
    ctx.strokeStyle = 'rgba(255,255,255,0.3)';
    ctx.lineWidth = 1;
    ctx.stroke();

    ctx.fillStyle = '#888';
    ctx.font = '11px Segoe UI';
    ctx.textAlign = 'center';
    ctx.fillText('搜索在各方向扩散，探索很多无效区域', (startX + endX) / 2, y1 + 35);

    // Gate HA*
    const gateXs = [190, 330, 440];
    ctx.beginPath();
    ctx.arc(startX, y2, 8, 0, Math.PI * 2);
    ctx.fillStyle = '#76ff03'; ctx.fill();
    ctx.beginPath();
    ctx.arc(endX, y2, 8, 0, Math.PI * 2);
    ctx.fillStyle = '#ffab00'; ctx.fill();

    for (let gi = 0; gi < gateXs.length; gi++) {
        const gx = gateXs[gi];
        ctx.beginPath();
        ctx.moveTo(gx, y2 - 25);
        ctx.lineTo(gx, y2 + 25);
        ctx.strokeStyle = '#ff5252';
        ctx.lineWidth = 3;
        ctx.stroke();
        ctx.fillStyle = '#ff8a80';
        ctx.font = 'bold 11px Segoe UI';
        ctx.textAlign = 'center';
        ctx.fillText(`G${gi + 1}`, gx, y2 - 30);
    }

    // directed arrows between gates
    const segments = [startX, ...gateXs, endX];
    const colors = ['#4fc3f7', '#81c784', '#fff176', '#ef9a9a'];
    const labels = ['i=0', 'i=1', 'i=2', 'i=3'];
    for (let s = 0; s < segments.length - 1; s++) {
        const x1 = segments[s] + 12;
        const x2 = segments[s + 1] - 12;
        ctx.beginPath();
        ctx.moveTo(x1, y2);
        ctx.lineTo(x2, y2);
        ctx.strokeStyle = colors[s];
        ctx.lineWidth = 3;
        ctx.stroke();
        // arrowhead
        ctx.beginPath();
        ctx.moveTo(x2, y2);
        ctx.lineTo(x2 - 8, y2 - 5);
        ctx.lineTo(x2 - 8, y2 + 5);
        ctx.closePath();
        ctx.fillStyle = colors[s];
        ctx.fill();

        ctx.fillStyle = colors[s];
        ctx.font = '10px monospace';
        ctx.textAlign = 'center';
        ctx.fillText(labels[s], (x1 + x2) / 2, y2 + 18);
    }

    ctx.fillStyle = '#888';
    ctx.font = '11px Segoe UI';
    ctx.textAlign = 'center';
    ctx.fillText('搜索按 gate 顺序定向推进，每段都有明确方向', (startX + endX) / 2, y2 + 38);
}

function toggleSkeleton() {
    showSkeleton = !showSkeleton;
    render();
}

function toggleClearance() {
    showClearanceMap = !showClearanceMap;
    render();
}

function updateStats() {
    const el = document.getElementById('stats');
    el.innerHTML = `
        <div class="stat-item"><div class="stat-val">${trees.length}</div><div class="stat-label">树干数</div></div>
        <div class="stat-item"><div class="stat-val">${gates.length}</div><div class="stat-label">检测到的 Gate</div></div>
        <div class="stat-item"><div class="stat-val">${gates.length > 0 ? gates.reduce((a, g) => Math.min(a, g.clearance), 99).toFixed(2) + 'm' : '-'}</div><div class="stat-label">最窄 Gate 宽度</div></div>
        <div class="stat-item"><div class="stat-val">${clearanceProfile.length > 0 ? clearanceProfile[clearanceProfile.length - 1].dist.toFixed(1) + 'm' : '-'}</div><div class="stat-label">骨架路径长度</div></div>
    `;
}

function regenerate() { generateForest(); }

generateForest();
</script>
</body>
</html>
