- `论文写作` — 撰写/修改 `3_paper/main.tex`
- `论文评审` — 同行评审，输出评审报告
- `直接告诉我要做什么`

## 启动时读取

```
bigmemory/热区/状态简报.md
bigmemory/热区/未关闭决策.md
bigmemory/热区/近期改动.md
.pipeline/README.md
```

